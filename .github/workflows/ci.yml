name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch the real optional VoIP contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: n-IA-hane/esphome-voip-stack
          ref: dev
          path: .test-deps/esphome-voip-stack
      - run: python -m ruff check esphome tests tools
      - name: Test production renderer and optional adapter
        env:
          VOIP_STACK_SOURCE: ${{ github.workspace }}/.test-deps/esphome-voip-stack
          VIDEO_ADMISSION_SANITIZE: "1"
        run: python -m pytest -q --junitxml=test-results/host.xml
      - name: Preserve host results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-host-results
          path: test-results/host.xml
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"
      - run: python -m pip install esphome==2026.10.0 Pillow==12.3.0
      - name: Compile and link standalone ESP32-S3 display firmware
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m esphome compile examples/standalone.yaml 2>&1 | tee test-results/standalone.log
      - name: Check pixels with the official source decoder
        run: >-
          python tools/qualify_esp_video_renderer_jpeg.py
          --component examples/.esphome/build/jpeg-display/managed_components/espressif__esp_jpeg
          --output test-results/pixels
      - name: Preserve firmware and pixel results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-firmware-results
          path: test-results/
          if-no-files-found: error
