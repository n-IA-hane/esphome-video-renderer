# Generic ESP32-S3 with octal PSRAM and an ST7789V display.
# Replace the pin allocation and PSRAM mode with your board's configuration.
esphome:
  name: jpeg-display
  min_version: 2026.10.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO2

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    cs_pin: GPIO5
    dc_pin: GPIO6
    reset_pin: GPIO7
    dimensions:
      width: 240
      height: 320
    auto_clear_enabled: false

lvgl:
  rotation: 90
  on_boot:
    - lambda: id(incoming_video).attach_video_container(id(video_surface));
  pages:
    - id: video_page
      widgets:
        - obj:
            id: video_surface
            width: 320
            height: 240
            pad_all: 0
            border_width: 0

esp_video_renderer:
  id: incoming_video
  width: 320
  height: 240
  framerate: 2
