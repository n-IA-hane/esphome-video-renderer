# Optional VoIP adapter example. Adjust display, I2S and Wi-Fi to your board.
packages:
  display: !include display-base.yaml

external_components:
  - source: github://n-IA-hane/esphome-video-renderer@dev
    components: [esp_video_renderer]
  - source: github://n-IA-hane/esphome-voip-stack@dev
    components: [voip_stack]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2s_audio:
  i2s_bclk_pin: GPIO9
  i2s_lrclk_pin: GPIO10

microphone:
  - platform: i2s_audio
    id: call_microphone
    adc_type: external
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit

esp_video_renderer:
  voip:
    id: incoming_video_sink
  on_first_frame:
    - logger.log: First video image submitted to LVGL
  on_video_ended:
    - logger.log: Video renderer session ended

voip_stack:
  id: phone
  microphone_source:
    microphone: call_microphone
  audio:
    codecs:
      - codec: pcm
        tx:
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 20
          - sample_rate: 16000
            pcm_format: s16le
            channels: 1
            frame_ms: 10
  video:
    codec: jpeg
    sink: incoming_video_sink
    width: 320
    height: 240
    framerate: 2
